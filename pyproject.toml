[project]
name = "eschool-assistant"
version = "0.1.0"
description = "Natural-language school search assistant on top of eSchool's public search"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=3.41.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eschool_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real eschool.ug site or the Gemini API (skipped unless selected with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]
